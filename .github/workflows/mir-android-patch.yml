name: mir-android-platform patch

# Builds a patched mir-android-platform for dipper (Focal / Halium 9, arm64).
#
# Fix: the DeviceQuirks GPU-probe context (select_egl_config_with_any_format)
# requests EGL_SURFACE_TYPE = EGL_WINDOW_BIT | EGL_PBUFFER_BIT. On sdm845 the
# Lomiri greeter's mir-android server starts while the system compositor still
# holds the only window-capable EGL config, so eglChooseConfig returns 0 and the
# greeter dies ("could not select EGL config") -> lightdm respawn loop = screen
# flicker. The probe only ever makes a PBUFFER surface, so EGL_WINDOW_BIT is
# unnecessary; dropping it lets the probe succeed alongside the compositor.

on:
  workflow_dispatch:
  push:
    branches: [ focal/port-bootstrap ]
    paths:
      - .github/workflows/mir-android-patch.yml

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Enable arm64 emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          sudo update-binfmts --enable qemu-aarch64

      - name: Build patched mir-android-platform in arm64 Focal chroot
        run: |
          set -eux
          cat > build.sh <<'INNER'
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y ca-certificates gnupg wget git devscripts equivs

          # UBports Focal repo provides the Mir/hybris dev packages.
          echo "deb http://repo.ubports.com/ focal main" > /etc/apt/sources.list.d/ubports.list
          wget -qO- https://repo.ubports.com/keyring.gpg | gpg --dearmor > /etc/apt/trusted.gpg.d/ubports.gpg || \
            wget -qO /etc/apt/trusted.gpg.d/ubports.gpg https://repo.ubports.com/keyring.gpg
          apt-get update

          git clone --depth 1 -b ubports/focal_-_android9 \
            https://gitlab.com/ubports/development/core/hybris-support/mir-android-platform.git src
          cd src

          # Patch ONLY the DeviceQuirks pbuffer probe (second occurrence).
          perl -0pi -e 's/(select_egl_config_with_any_format.*?EGL_SURFACE_TYPE,\s*)EGL_WINDOW_BIT \| EGL_PBUFFER_BIT/${1}EGL_PBUFFER_BIT/s' \
            src/platforms/android/server/gl_context.cpp
          grep -n "EGL_SURFACE_TYPE" src/platforms/android/server/gl_context.cpp

          # Install build deps and build the .deb set.
          mk-build-deps -i -r -t "apt-get -y --no-install-recommends" debian/control
          dpkg-buildpackage -b -uc -us -aarch64 || dpkg-buildpackage -b -uc -us
          ls -l ..
          mkdir -p /out
          cp ../*.deb /out/ || true
          INNER

          docker run --rm --platform linux/arm64 \
            -v "$PWD":/work -w /work arm64v8/ubuntu:focal \
            bash -lc 'cp /work/build.sh /build.sh && mkdir -p /out && bash /build.sh && cp /out/*.deb /work/ 2>/dev/null || true; ls -l /work/*.deb || true'

      - name: Extract graphics platform .so from .deb
        run: |
          set -eux
          mkdir -p out
          for d in *.deb; do dpkg-deb -x "$d" extract || true; done
          find extract -name 'graphics-android2.so*' -o -name '*android*.so*' | tee out/so-list.txt
          find extract -name 'graphics-android2.so*' -exec cp {} out/ \; || true
          cp *.deb out/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: mir-android-platform-patched
          path: out/
